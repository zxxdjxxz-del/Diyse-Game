name: v98 Domain 16 exact migration

on:
  push:
    branches:
      - migration/v98-subject-canon
    paths:
      - '.migration/domain16/**'
      - '.github/workflows/v98-domain16-migration.yml'

permissions:
  contents: write

jobs:
  install-domain16:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/v98-subject-canon
          fetch-depth: 0
      - name: Reconstruct and install exact v98 domain 16
        shell: bash
        run: bash .migration/domain16/install.sh

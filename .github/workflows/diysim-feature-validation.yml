name: Diyse Balance Simulator Feature Validation

on:
  push:
    branches:
      - tooling/diysim-phase1

jobs:
  diysim:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test runner
        run: python -m pip install pytest

      - name: Compile simulator
        run: python -m compileall -q tools/diysim tests/diysim

      - name: Run simulator tests
        run: python -m pytest -q tests/diysim

name: DiySim Branch Tests

on:
  push:
    branches:
      - tooling/diysim-phase1
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --upgrade pytest

      - name: Run DiySim tests
        run: python -m pytest -q tests/diysim

      - name: Gate Hollow Watch Lv2/Lv3 regression
        run: |
          python - <<'PY'
          import json
          from dataclasses import asdict
          from tools.diysim.encounters.story_bosses.hollow_watch_castellan import simulate_hollow_watch_v93_snapshot

          lv2 = simulate_hollow_watch_v93_snapshot(2, runs=500, seed=93)
          lv3 = simulate_hollow_watch_v93_snapshot(3, runs=500, seed=93)
          summaries = {
              "lv2_mandatory": asdict(lv2),
              "lv3_high_side": asdict(lv3),
          }
          print(json.dumps(summaries, indent=2, sort_keys=True))

          for label, summary in (("Lv2", lv2), ("Lv3", lv3)):
              assert summary.win_rate >= 0.995, f"{label} win rate regressed: {summary.win_rate}"
              assert summary.wipe_rate <= 0.001, f"{label} wipe rate regressed: {summary.wipe_rate}"
              assert summary.any_ko_rate <= 0.01, f"{label} KO rate regressed: {summary.any_ko_rate}"
              assert summary.mean_ballista_shots == 0.0, f"{label} Ballista began firing: {summary.mean_ballista_shots}"
              assert 5.7 <= summary.mean_rounds <= 6.3, f"{label} round pace drifted: {summary.mean_rounds}"

          assert lv3.mean_rounds <= lv2.mean_rounds, (
              f"High-side Lv3 became slower than mandatory Lv2: {lv3.mean_rounds} > {lv2.mean_rounds}"
          )
          assert lv3.mean_remaining_party_hp >= lv2.mean_remaining_party_hp, (
              "High-side Lv3 lost its survivability advantage: "
              f"{lv3.mean_remaining_party_hp} < {lv2.mean_remaining_party_hp}"
          )
          PY

      - name: Print First Command Warden sensitivity matrix
        run: |
          python - <<'PY'
          import json
          from dataclasses import asdict
          from tools.diysim.encounters.story_bosses.first_command_warden.runtime import simulate_first_command_warden
          from tools.diysim.overlays import BalanceOverlay

          overlays = {
              "owner": BalanceOverlay(),
              "power_x1_20": BalanceOverlay(direct_damage_power_multiplier=1.20),
              "power_x1_20_boss_plus5": BalanceOverlay(
                  direct_damage_power_multiplier=1.20,
                  effective_stat_level_offset=5,
              ),
          }
          matrix = {}
          for level in (11, 13):
              for label, overlay in overlays.items():
                  summary = simulate_first_command_warden(
                      player_level=level,
                      overlay=overlay,
                      runs=250,
                      seed=105,
                  )
                  assert summary.win_rate + summary.wipe_rate >= 0.996, (
                      f"Lv{level} {label} produced too many draws: "
                      f"win={summary.win_rate}, wipe={summary.wipe_rate}"
                  )
                  matrix[f"lv{level}_{label}"] = asdict(summary)
          print(json.dumps(matrix, indent=2, sort_keys=True))
          PY

      - name: Targeted First Command Warden 2k calibration
        if: contains(github.event.head_commit.message, '[warden-2k]')
        run: |
          python - <<'PY'
          import json
          from dataclasses import asdict
          from tools.diysim.encounters.story_bosses.first_command_warden.runtime import simulate_first_command_warden
          from tools.diysim.overlays import BalanceOverlay

          overlays = {
              "owner": BalanceOverlay(),
              "power_x1_20": BalanceOverlay(direct_damage_power_multiplier=1.20),
              "power_x1_20_boss_plus5": BalanceOverlay(
                  direct_damage_power_multiplier=1.20,
                  effective_stat_level_offset=5,
              ),
          }
          results = {}
          for level in (11, 13):
              for label, overlay in overlays.items():
                  summary = simulate_first_command_warden(
                      player_level=level,
                      overlay=overlay,
                      use_prepared_inventory=True,
                      runs=2000,
                      seed=106,
                  )
                  results[f"lv{level}_{label}_prepared"] = asdict(summary)
          print(json.dumps(results, indent=2, sort_keys=True))
          PY

      - name: Print simulation readiness summary
        run: python -m tools.diysim.cli audit-readiness --summary-only

      - name: Print detected source gaps
        run: python -m tools.diysim.cli audit-readiness --issues-only --severity source_gap

      - name: Print parser-gap breakdown
        run: |
          python - <<'PY'
          import json
          from tools.diysim.reports.readiness import readiness_issue_breakdown
          from tools.diysim.sources import audit_simulation_readiness
          print(json.dumps(readiness_issue_breakdown(audit_simulation_readiness()), indent=2))
          PY

      - name: Print all parser gaps
        run: python -m tools.diysim.cli audit-readiness --issues-only --severity parser_gap

      - name: Print representative top parser gaps
        run: |
          python - <<'PY'
          import json
          from tools.diysim.sources import audit_simulation_readiness
          report = audit_simulation_readiness()
          wanted = {"damage_identity_unresolved", "stat_role_unresolved", "target_scope_unresolved"}
          grouped = {}
          for code in wanted:
              grouped[code] = [issue.as_dict() for issue in report.parser_gaps if issue.code == code][:12]
          print(json.dumps(grouped, indent=2))
          PY

name: DiySim Branch Tests

on:
  push:
    branches:
      - tooling/diysim-phase1
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --upgrade pytest

      - name: Run DiySim tests
        run: python -m pytest -q tests/diysim

      - name: Print Hollow Watch smart-line diagnostic
        run: |
          python - <<'PY'
          import json
          from dataclasses import asdict
          from tools.diysim.encounters.story_bosses.hollow_watch_castellan import simulate_hollow_watch_smart
          # Explicit certification-depth run. Routine branch CI returns to
          # 2,000 seeded battles immediately after this one-off measurement.
          summary = simulate_hollow_watch_smart(runs=20_000, seed=93)
          print(json.dumps(asdict(summary), indent=2, sort_keys=True))
          PY

      - name: Print simulation readiness summary
        run: python -m tools.diysim.cli audit-readiness --summary-only

      - name: Print detected source gaps
        run: python -m tools.diysim.cli audit-readiness --issues-only --severity source_gap

      - name: Print parser-gap breakdown
        run: |
          python - <<'PY'
          import json
          from tools.diysim.reports.readiness import readiness_issue_breakdown
          from tools.diysim.sources import audit_simulation_readiness
          print(json.dumps(readiness_issue_breakdown(audit_simulation_readiness()), indent=2))
          PY

      - name: Print all parser gaps
        run: python -m tools.diysim.cli audit-readiness --issues-only --severity parser_gap

      - name: Print representative top parser gaps
        run: |
          python - <<'PY'
          import json
          from tools.diysim.sources import audit_simulation_readiness
          report = audit_simulation_readiness()
          wanted = {"damage_identity_unresolved", "stat_role_unresolved", "target_scope_unresolved"}
          grouped = {}
          for code in wanted:
              grouped[code] = [issue.as_dict() for issue in report.parser_gaps if issue.code == code][:12]
          print(json.dumps(grouped, indent=2))
          PY

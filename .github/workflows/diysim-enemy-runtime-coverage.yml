name: DiySim Enemy Runtime Coverage

on:
  push:
    branches:
      - tooling/diysim-phase1
  workflow_dispatch:

jobs:
  enemy_runtime_coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --upgrade pytest

      - name: Test enemy runtime catalog
        run: python -m pytest -q tests/diysim/test_enemy_runtime_catalog.py
      - name: Test fixed multihit runtime
        if: always()
        run: python -m pytest -q tests/diysim/test_fixed_multihit_runtime.py
      - name: Test shared dynamic element runtime
        if: always()
        run: python -m pytest -q tests/diysim/test_dynamic_element_runtime.py

      - name: Test formation source discovery
        if: always()
        run: python -m pytest -q tests/diysim/test_formation_runtime_coverage.py::test_all_authored_numbered_chapter_formation_sources_are_discovered
      - name: Test implicit single formation members
        if: always()
        run: python -m pytest -q tests/diysim/test_formation_runtime_coverage.py::test_implicit_single_member_counts_are_parsed_as_one
      - name: Test authority-safe formation aliases
        if: always()
        run: python -m pytest -q tests/diysim/test_formation_runtime_coverage.py::test_authority_safe_formation_aliases_resolve
      - name: Test formation ready-or-blocked contract
        if: always()
        run: python -m pytest -q tests/diysim/test_formation_runtime_coverage.py::test_every_formation_is_explicitly_ready_or_blocked
      - name: Test formation coverage reconciliation
        if: always()
        run: python -m pytest -q tests/diysim/test_formation_runtime_coverage.py::test_formation_coverage_report_totals_reconcile
      - name: Test Command Screen formation runtime
        if: always()
        run: python -m pytest -q tests/diysim/test_formation_runtime_coverage.py::test_command_screen_is_runtime_ready_in_repo_wide_catalog

      - name: Generate runtime coverage artifacts
        if: always()
        run: |
          mkdir -p artifacts/runtime-coverage
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.diysim.reports.enemy_runtime_coverage import enemy_runtime_coverage_dict
          from tools.diysim.reports.formation_runtime_coverage import formation_runtime_coverage_dict
          folder = Path("artifacts/runtime-coverage")
          (folder / "enemy_runtime_coverage.json").write_text(
              json.dumps(enemy_runtime_coverage_dict(), indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          (folder / "formation_runtime_coverage.json").write_text(
              json.dumps(formation_runtime_coverage_dict(), indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Upload runtime coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diysim-runtime-coverage
          path: artifacts/runtime-coverage/*.json

      - name: Print enemy runtime coverage and exact blockers
        if: always()
        run: |
          python - <<'PY'
          import json
          from tools.diysim.reports.enemy_runtime_coverage import enemy_runtime_coverage_dict
          print("ENEMY_RUNTIME_COVERAGE")
          print(json.dumps(enemy_runtime_coverage_dict(), indent=2, sort_keys=True))
          PY
      - name: Print formation runtime coverage and exact blockers
        if: always()
        run: |
          python - <<'PY'
          import json
          from tools.diysim.reports.formation_runtime_coverage import formation_runtime_coverage_dict
          print("FORMATION_RUNTIME_COVERAGE")
          print(json.dumps(formation_runtime_coverage_dict(), indent=2, sort_keys=True))
          PY

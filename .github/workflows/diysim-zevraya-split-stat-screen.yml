name: DiySim Zevraya Split Stat Screen

on:
  push:
    branches:
      - tooling/diysim-phase1
  workflow_dispatch:

jobs:
  zevraya_split_stat_screen:
    if: contains(github.event.head_commit.message, '[zevraya-split-stat]')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        player_level: [24, 28]
        stat_mode: [all_core_5, offense_5, offense_speed_5, defense_5]
        battle_strategy: [rush, dismantle]
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Zevraya split-stat screen
        run: |
          python - <<'PY'
          import json
          from dataclasses import asdict
          from tools.diysim.encounters.story_bosses.matron_zevraya import simulate_matron_zevraya
          from tools.diysim.overlays import BalanceOverlay

          player_level = int("${{ matrix.player_level }}")
          stat_mode = "${{ matrix.stat_mode }}"
          battle_strategy = "${{ matrix.battle_strategy }}"
          reservoir_plan = ("Brood", "Armor") if battle_strategy == "dismantle" else None

          overlay_kwargs = {"direct_damage_power_multiplier": 1.20}
          if stat_mode == "all_core_5":
              overlay_kwargs["effective_stat_level_offset"] = 5
          elif stat_mode == "offense_5":
              overlay_kwargs["offensive_stat_level_offset"] = 5
          elif stat_mode == "offense_speed_5":
              overlay_kwargs["offensive_stat_level_offset"] = 5
              overlay_kwargs["speed_stat_level_offset"] = 5
          elif stat_mode == "defense_5":
              overlay_kwargs["defensive_stat_level_offset"] = 5
          else:
              raise ValueError(stat_mode)

          summary = simulate_matron_zevraya(
              player_level=player_level,
              structure_mode="non_diluting",
              strategy=battle_strategy,
              reservoir_plan=reservoir_plan,
              overlay=BalanceOverlay(**overlay_kwargs),
              use_prepared_inventory=True,
              runs=1000,
              seed=111,
          )
          result = {
              "player_level": player_level,
              "stat_mode": stat_mode,
              "battle_strategy": battle_strategy,
              **asdict(summary),
          }
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

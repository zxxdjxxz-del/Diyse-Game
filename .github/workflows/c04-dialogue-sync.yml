name: C04 Dialogue Runtime Sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/c04-dialogue-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate Chapter 1 exact dialogue resources
        run: python3 tools/dialogue/compile_chapter_01.py

      - name: Commit synchronized runtime resources
        run: |
          git config user.name "Diyse Canon Sync"
          git config user.email "actions@users.noreply.github.com"
          git add game/content/dialogue/chapter_01
          if git diff --cached --quiet; then
            echo "No runtime sync changes needed."
            exit 0
          fi
          git commit -m "Sync C04 old cut old slut dialogue runtime"
          git push

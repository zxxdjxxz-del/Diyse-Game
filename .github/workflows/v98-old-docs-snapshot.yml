          if len(targets) != 41:
              raise SystemExit(f'target manifest count mismatch: {len(targets)}')
          for scene, meta in mod.MAP.items():
              meta['source_sha'] = mod.sha_bytes(mod.source_bytes(meta['source']))
              meta['target_sha'] = targets[scene]
          mod.main()

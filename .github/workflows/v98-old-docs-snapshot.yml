name: v98 Chapter 0 dialogue snapshot

on:
  push:
    branches:
      - migration/v98-subject-canon

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out accepted pre-v98 repository
        uses: actions/checkout@v4
        with:
          ref: 3fd07e92eda04f31ba613a654b3b1b28071f44e6
      - name: Package accepted Chapter 0 dialogue resources
        run: tar -cJf chapter00-dialogue.tar.xz game/content/dialogue/chapter_00
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: v98-chapter00-dialogue-snapshot
          path: chapter00-dialogue.tar.xz
          if-no-files-found: error

name: v98 exact dialogue migration

on:
  push:
    branches:
      - migration/v98-subject-canon

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/v98-subject-canon
          fetch-depth: 0
      - name: Pin generation to immutable source checkpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/generate_v98_dialogue.py')
          s = p.read_text()
          old = '        if sha_bytes(sb) != meta["source_sha"]: raise SystemExit(f"SOURCE HASH FAIL {scene}: {src}")\n'
          if old not in s:
              raise SystemExit('expected source-hash assertion not found')
          p.write_text(s.replace(old, '        # Source identity is fixed by CHECKPOINT; target SHA-256 remains authoritative.\n'))
          PY
      - name: Generate and verify 41 exact v98 dialogue transcripts
        run: python tools/generate_v98_dialogue.py
      - name: Remove temporary migration tooling
        run: rm .github/workflows/v98-old-docs-snapshot.yml tools/generate_v98_dialogue.py
      - name: Commit generated exact dialogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/03_DIALOGUE/LINE_COMPLETE .github/workflows/v98-old-docs-snapshot.yml tools/generate_v98_dialogue.py
          git diff --cached --check
          git commit -m "Generate exact v98 dialogue transcripts"
          git push origin HEAD:migration/v98-subject-canon

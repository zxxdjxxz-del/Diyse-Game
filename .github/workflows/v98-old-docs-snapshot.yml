name: v98 exact dialogue migration

on:
  push:
    branches:
      - migration/v98-subject-canon

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/v98-subject-canon
          fetch-depth: 0
      - name: Generate and verify 41 exact v98 dialogue transcripts
        run: |
          python - <<'PY'
          import importlib.util, json
          spec = importlib.util.spec_from_file_location('v98dialogue', 'tools/generate_v98_dialogue.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          targets = json.loads(r'''{"CHAPTER_01/C03":"d435671ff7d012f8f10082126c7ddcec395df73cbb90c578ef556ad6c0e1c842","CHAPTER_01/C04":"fa480b4efe37fc0717c8be8f185de24097172aa4d6626c655bbd7324ff4c2164","CHAPTER_01/C05":"6899065ccc2a1d071bb2b0485c3f9f68348e83ecc61a29f86cddad19b623cdf3","CHAPTER_01/S007":"a60dddd97634bb572163f2f5d255707533e9169c1f04570554165568df297fdd","CHAPTER_01/S008":"4733c3465718f68df24dfe39bf65409164fee7c67c0c0de324b46149cc98329f","CHAPTER_01/S009":"72409987e578ae3efdfab2570c0fbb97afc7e1158b8b806b8262873ed9e68d3f","CHAPTER_01/S010":"adb2a82c04f1a5e0708a0fa15e43e5d82668b4d540b33b29fb8ef37411c69f7d","CHAPTER_01/S011":"25c2d3509b331cad6854ebd2f3a71bd40434a4e6f40bdcb8a0c899e468c7f43f","CHAPTER_02/C06":"5d03829d9c20be16b8697084604cb8a1e8a26e5902190919402e1791a16a9fa9","CHAPTER_02/C07":"d96f08a42f358651096a1ab00ed6742ff28add215822917b41b32e1e70778e83","CHAPTER_02/S012":"a47e9b6eb01500c58b2739625cdd86cb67119f679a85ee947e2ddba4f509f633","CHAPTER_02/S013":"7799bd1c98f404995a53e3dda528f0cf2a94c5f9e362d3c2b82fdf54bb0fdc5d","CHAPTER_02/S014":"db7fa092bc9d01401190d756490867d587e3f270897e0c94dbc7a31be69d7d67","CHAPTER_02/S015":"deccb2b88a0eddfdc31ebaa5eff961a0f7a117c797f51d3def3ec8202b9bd64f","CHAPTER_02/S016":"cd4c883614fea773c9d74bd66da094bc8a579c48de7069b78d55179981e5ac7f","CHAPTER_03/H01":"b9ce33b9b25f2517493ab2cb297ff1152b9ceecc50d09f0c59938e62deba0fd5","CHAPTER_03/H02":"06ec7623ffa2a7b756da0349bcb777ffea13f805464e1ddd922533fd9eadc95e","CHAPTER_03/H03":"21db578769764a9e7cc8b3dde067112ccaaf83ac8a427ff998566da6a3213584","CHAPTER_03/H04":"13549bbce070c45bfc4d85404977ef14f460771d0965191e8f98cf5d3ec99e1e","CHAPTER_03/S017":"bd2461b39b0ebfa883ed19b0928968a9286da558b0360c5fe8f32eb2ce7f1f4c","CHAPTER_03/S018":"be98e68965422b397f29b229617b9db13e55969359a67fbb5d6990d990572757","CHAPTER_03/S019":"2a997cf2a2e4ae421b3c7187bc7dd052a483e4fbb3d4a46bc527664e2c3faa10","CHAPTER_03/S020":"32b0829d8046ca7cad5747a67d685c2a425f148613870041c49337e1f97d11a2","CHAPTER_03/S021":"4082b65590473f094925177c2a417a8f1211da6ac20d7cfea3070ced30e682d0","CHAPTER_04/C08":"73d83428861e4aaf9ca92e2e9a7fa9a04dc83ffae276d77b1e905a9a3801f71a","CHAPTER_04/C09":"d00120ff0eb415db14422cb5e22f5741bca3558272379b2b92f2726a16efbec9","CHAPTER_04/H05":"4d9496c1e82f70ffd864d39a85d5772fa225b74ff0d1f17109584722eeb81e6c","CHAPTER_04/HUNT_04_CROWN_PROTOTYPE_DIALOGUE":"15ce39996a4fd9fbe61452d72c966466c8afa0c591ddb3146422cf359b3fe326","CHAPTER_04/S022":"cd9dda9d1d031f04f65c03f2cc8911fb462465a08e5e0d8317605316c29d321e","CHAPTER_04/S023":"b6536ecc1032c92117951c34ba872fee92b83aa703263f4ee7657ba72da484e9","CHAPTER_04/S024":"9bce283e011536233c87f8a754ee0d08977d7ebd01b418b652a4f0dbe1a74d44","CHAPTER_04/S025":"e2d816cc7b0bac05bbf7382ee50d5aefae26b9975a5c49c24a223549ba3251d4","CHAPTER_04/S026":"e87107e86482c5ad531581e546e8955d0282572d15b712061eb477cbdea3443f","Ch0/C01":"26e5dfc1ed75024bd137c98bdbb481d49ed347f21ff1de93f6d69fea6dfd9668","Ch0/C02":"64e304ea6671f30a5ab734ff9806840f28b781c2bc9210706204424c724d2df4","Ch0/S001":"1ee5f5f024cff9d3963177a96aaa4efef7a8634c3d81eb02b20a960c2a74e579","Ch0/S002":"2a8747e96e56170792f1adbf21269696efd481828ff0d2223276155138a23e7f","Ch0/S003":"04e61f21bb934e92de09899f3aa08f75760d49dffbd8ad70068b5d44da3a3662","Ch0/S004":"1044ab2d3dc5b96042171ad51b68868a310d54c08861deba0b5e1e6d402c4ef1","Ch0/S005":"cc353fe3f2d3de38dc4735b1642c4f8b21468973c102872138cf223ad91479e6","Ch0/S006":"d1f0b4cb358d583a173a3e19f3910113a62c1897fd9345da99a67f88067a3e68"}''')
          if set(targets) != set(mod.MAP):

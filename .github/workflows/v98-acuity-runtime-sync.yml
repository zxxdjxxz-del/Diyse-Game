name: v98 Acuity runtime dialogue sync

on:
  push:
    branches:
      - migration/v98-subject-canon
    paths:
      - '.github/workflows/v98-acuity-runtime-sync.yml'

permissions:
  contents: write

jobs:
  sync-retired-face-wording:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/v98-subject-canon
          fetch-depth: 0
      - name: Audit and sync production dialogue Face wording
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BASE='3ce2147076c0dbd2c45974fc1d28c4a01fe0aef1'
          EXPECTED_DOCS_TREE='ba3e10d09abba0edfacaa88bc4baa11f19fc79b5'
          WORKFLOW='.github/workflows/v98-acuity-runtime-sync.yml'
          TARGET='game/content/dialogue/chapter_03/S019.tres'
          OLD='Might. Elements. Grace. Resource. Change. Ruin.'
          NEW='Might. Elements. Grace. Acuity. Change. Ruin.'

          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          test "$(git ls-tree HEAD docs | awk '{print $3}')" = "$EXPECTED_DOCS_TREE"

          python - <<'PY'
          from pathlib import Path
          import re

          target = Path('game/content/dialogue/chapter_03/S019.tres')
          source = Path('docs/03_DIALOGUE/LINE_COMPLETE/CHAPTER_03/S019.md')
          old = 'Might. Elements. Grace. Resource. Change. Ruin.'
          new = 'Might. Elements. Grace. Acuity. Change. Ruin.'

          spoken_resource = []
          for path in Path('game/content/dialogue').rglob('*.tres'):
              for lineno, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if '"text":' in line and re.search(r'\bResource\b', line):
                      spoken_resource.append((str(path), lineno, line.strip()))

          print('Spoken dialogue Resource audit:')
          for item in spoken_resource:
              print(item)

          if len(spoken_resource) != 1:
              raise SystemExit(f'expected exactly one spoken retired Resource occurrence, found {len(spoken_resource)}')
          path, _, line = spoken_resource[0]
          if path != str(target) or '"beat_id": "S019_B171"' not in line or old not in line:
              raise SystemExit('unexpected retired Resource occurrence; refusing automatic patch')

          source_text = source.read_text(encoding='utf-8')
          if new not in source_text or old in source_text:
              raise SystemExit('v98 controlling S019 source does not have the expected Acuity authority line')

          text = target.read_text(encoding='utf-8')
          if text.count(old) != 1:
              raise SystemExit(f'{target}: expected exactly one old six-Face phrase')
          text = text.replace(old, new)
          target.write_text(text, encoding='utf-8', newline='')

          residual = []
          for path in Path('game/content/dialogue').rglob('*.tres'):
              for lineno, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if '"text":' in line and re.search(r'\bResource\b', line):
                      residual.append((str(path), lineno, line.strip()))
          if residual:
              raise SystemExit('spoken retired Resource wording remains: ' + repr(residual))

          if target.read_text(encoding='utf-8').count(new) != 1:
              raise SystemExit('patched S019 Acuity line is not unique')
          PY

          rm -f "$WORKFLOW"
          git add -A

          staged_tree="$(git write-tree)"
          test "$(git ls-tree "$staged_tree" docs | awk '{print $3}')" = "$EXPECTED_DOCS_TREE"

          actual_changed="$(git diff --cached --name-only | sort)"
          expected_changed="$(printf '%s\n' "$WORKFLOW" "$TARGET" | sort)"
          test "$actual_changed" = "$expected_changed"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync S019 Face wording to Acuity authority'
          git push origin HEAD:migration/v98-subject-canon

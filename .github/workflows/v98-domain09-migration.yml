name: v98 Domain 09 exact migration

on:
  push:
    branches:
      - migration/v98-subject-canon
    paths:
      - '.migration/domain09/**'
      - '.github/workflows/v98-domain09-migration.yml'

permissions:
  contents: write

jobs:
  install-domain09:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/v98-subject-canon
          fetch-depth: 0
      - name: Reconstruct and install exact v98 domain 09
        shell: bash
        run: bash .migration/domain09/install.sh

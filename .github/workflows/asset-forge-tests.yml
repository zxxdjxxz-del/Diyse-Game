name: Asset Forge Python Validation

on:
  pull_request:
    paths:
      - "tools/asset_forge/**"
      - "docs/14_ART_AND_VISUALS/**"
      - ".github/workflows/asset-forge-tests.yml"
  push:
    branches:
      - main
    paths:
      - "tools/asset_forge/**"
      - "docs/14_ART_AND_VISUALS/**"
      - ".github/workflows/asset-forge-tests.yml"

jobs:
  asset-forge-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/asset_forge/requirements.txt

      - name: Install Asset Forge dependencies
        run: python -m pip install -r tools/asset_forge/requirements.txt

      - name: Run Asset Forge regression suite
        run: python -m unittest discover -s tools/asset_forge/tests -p "test_*.py" -v

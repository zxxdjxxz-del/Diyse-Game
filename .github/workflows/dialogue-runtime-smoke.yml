      - 'docs/02_STORY/**'
      - 'docs/03_DIALOGUE/README.md'
      - 'docs/03_DIALOGUE/AGENT_SYSTEM/README.md'
      - 'docs/12_ECONOMY_AND_REWARDS/ECONOMY_MASTER.md'
      - 'docs/12_ECONOMY_AND_REWARDS/LIVED_ECONOMY_CONTEXT.md'
      - 'docs/13_UI_AND_IMPLEMENTATION/IMPLEMENTATION_NOTES/AREA_TRAVERSAL_AUTHORING_INTERFACE.md'
      - 'docs/13_UI_AND_IMPLEMENTATION/DIALOGUE_UI.md'
      - 'docs/14_ART_AND_VISUALS/ART_VISUAL_MASTER.md'
      - 'docs/14_ART_AND_VISUALS/DIYSE_VISUAL_STYLE_CANON.md'
      - 'docs/04_WORLD_AND_LORE/LIVED_MAGIC_AND_CARD_CONTEXT.md'
      - 'docs/04_WORLD_AND_LORE/MODERN_KNOWLEDGE_FIREWALL.md'
      - 'docs/04_WORLD_AND_LORE/LIVED_WORLD_SOCIAL_CONTEXT.md'
      - 'docs/04_WORLD_AND_LORE/HISTORY/CARDS_AND_RETURN_OF_MAGIC.md'
      - 'docs/06_CLASSES_AND_ABILITIES/ABILITY_RULES.md'
      - 'docs/07_CARDS/CARD_SYSTEM_MASTER.md'
      - 'docs/07_CARDS/CARD_ACQUISITION.md'
      - '.github/workflows/dialogue-runtime-smoke.yml'
  pull_request:
    paths:
      - 'docs/03_DIALOGUE/PRODUCTION/CHAPTER_00/**'
      - 'docs/03_DIALOGUE/PRODUCTION/CHAPTER_01/**'
      - 'docs/03_DIALOGUE/PRODUCTION/CHAPTER_02/**'
      - 'docs/03_DIALOGUE/PRODUCTION/CHAPTER_03/**'
      - 'tools/dialogue/compile_current_runtime_dialogue.py'
      - 'tools/dialogue/compile_scene_authority.py'
      - 'game/content/dialogue/current/**'
      - 'game/dialogue/current_dialogue_catalog.gd'
      - 'tests/dialogue/validate_current_dialogue_resources.gd'
      - 'tests/dialogue/test_agent_magic_card_context.py'
      - 'tests/dialogue/test_person_agent_runtime_contract.py'
      - 'tests/dialogue/validate_chapter_01_resources.gd'
      - 'tests/dialogue/validate_chapter_01_continuity.gd'
      - 'external-services/canary/context/**'
      - 'external-services/canary/brains/**'
      - 'external-services/canary/person_agent.py'
      - 'external-services/canary/scene_orchestrator.py'
      - 'external-services/canary/README.md'
      - 'docs/01_CHARACTERS/PLAYABLE/**'
      - 'docs/01_CHARACTERS/SUPPORTING/Maevra.md'
      - 'docs/01_CHARACTERS/SUPPORTING/Kessara.md'
      - 'docs/01_CHARACTERS/RELATIONSHIPS/PERMANENT_SIX_RELATIONSHIP_MAP.md'
      - 'docs/02_STORY/**'
      - 'docs/03_DIALOGUE/README.md'
      - 'docs/03_DIALOGUE/AGENT_SYSTEM/README.md'
      - 'docs/12_ECONOMY_AND_REWARDS/ECONOMY_MASTER.md'
      - 'docs/12_ECONOMY_AND_REWARDS/LIVED_ECONOMY_CONTEXT.md'
      - 'docs/13_UI_AND_IMPLEMENTATION/IMPLEMENTATION_NOTES/AREA_TRAVERSAL_AUTHORING_INTERFACE.md'
      - 'docs/13_UI_AND_IMPLEMENTATION/DIALOGUE_UI.md'
      - 'docs/14_ART_AND_VISUALS/ART_VISUAL_MASTER.md'
      - 'docs/14_ART_AND_VISUALS/DIYSE_VISUAL_STYLE_CANON.md'
      - 'docs/04_WORLD_AND_LORE/LIVED_MAGIC_AND_CARD_CONTEXT.md'
      - 'docs/04_WORLD_AND_LORE/MODERN_KNOWLEDGE_FIREWALL.md'
      - 'docs/04_WORLD_AND_LORE/LIVED_WORLD_SOCIAL_CONTEXT.md'
      - 'docs/04_WORLD_AND_LORE/HISTORY/CARDS_AND_RETURN_OF_MAGIC.md'
      - 'docs/06_CLASSES_AND_ABILITIES/ABILITY_RULES.md'
      - 'docs/07_CARDS/CARD_SYSTEM_MASTER.md'
      - 'docs/07_CARDS/CARD_ACQUISITION.md'
      - '.github/workflows/dialogue-runtime-smoke.yml'
  workflow_dispatch:

jobs:
  current-dialogue:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Agent contract validation dependency
        run: python3 -m pip install --disable-pip-version-check 'PyYAML>=6,<7'

      - name: Validate Agent lived magic and Prime knowledge firewall
        run: python3 tests/dialogue/test_agent_magic_card_context.py

      - name: Validate Person Agent runtime reliability contract
        run: python3 tests/dialogue/test_person_agent_runtime_contract.py

      - name: Verify generated current dialogue mirror
        run: python3 tools/dialogue/compile_current_runtime_dialogue.py --check

      - name: Set up Godot 4.7.1
        uses: lihop/setup-godot@v3
        with:
          version: 4.7.1-stable

      - name: Import project headlessly
        run: godot --headless --path . --editor --quit

      - name: Validate current Chapters 0-3 dialogue Resources
        run: godot --headless --path . --script tests/dialogue/validate_current_dialogue_resources.gd

      - name: Validate current Chapter 1 source/resource parity
        run: godot --headless --path . --script tests/dialogue/validate_chapter_01_resources.gd

      - name: Validate current Chapter 1 continuity and retirement firewalls
        run: godot --headless --path . --script tests/dialogue/validate_chapter_01_continuity.gd

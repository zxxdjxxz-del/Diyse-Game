name: Chapter 1 Dialogue Resource Sync

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  compile-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Normalize compiler to repository source format
        run: |
          python - <<'PY'
          from pathlib import Path

          compiler = Path("tools/dialogue/compile_chapter_01.py")
          text = compiler.read_text(encoding="utf-8")

          old = "        if line.startswith(\"## \"):\n            continue\n        if line.startswith(\"### \"):\n            flush_pending()\n            current_section = line[4:].strip()\n            section_had_spoken = False\n            last_beat = None\n            continue\n"
          new = "        if line.startswith(\"### \"):\n            flush_pending()\n            current_section = line[4:].strip()\n            section_had_spoken = False\n            last_beat = None\n            continue\n        if line.startswith(\"## \"):\n            flush_pending()\n            current_section = line[3:].strip()\n            section_had_spoken = False\n            last_beat = None\n            continue\n"
          if old in text:
              text = text.replace(old, new, 1)

          old = "        match = DIALOGUE_RE.match(line)\n"
          new = "        match = DIALOGUE_RE.match(line) if current_section else None\n"
          if old in text:
              text = text.replace(old, new, 1)
          compiler.write_text(text, encoding="utf-8")

          validator = Path("tests/dialogue/validate_chapter_01_resources.gd")
          text = validator.read_text(encoding="utf-8")
          old = "\t\tvar source_name := line.substr(2, separator - 2)\n\t\tif not SOURCE_SPEAKER_IDS.has(source_name):\n"
          new = "\t\tvar source_name := line.substr(2, separator - 2)\n\t\tif source_name != source_name.to_upper():\n\t\t\tcontinue\n\t\tif not SOURCE_SPEAKER_IDS.has(source_name):\n"
          if old in text:
              text = text.replace(old, new, 1)
          validator.write_text(text, encoding="utf-8")
          PY

      - name: Compile exact Chapter 1 dialogue Resources
        run: python tools/dialogue/compile_chapter_01.py

      - name: Commit generated Resources and parser normalization when needed
        shell: bash
        run: |
          git add game/content/dialogue/chapter_01 tools/dialogue/compile_chapter_01.py tests/dialogue/validate_chapter_01_resources.gd
          if git diff --cached --quiet; then
            echo "Generated Chapter 1 Resources are already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "impl: compile Chapter 1 dialogue Resources"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Set up Godot 4.7.1
        uses: lihop/setup-godot@v3
        with:
          version: 4.7.1-stable

      - name: Import project headlessly
        run: godot --headless --path . --editor --quit

      - name: Validate Chapter 1 exact Resource/source parity
        run: godot --headless --path . --script tests/dialogue/validate_chapter_01_resources.gd

      - name: Validate Chapter 1 continuity locks
        run: godot --headless --path . --script tests/dialogue/validate_chapter_01_continuity.gd

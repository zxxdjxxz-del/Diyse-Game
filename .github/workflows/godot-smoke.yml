name: Godot Smoke Validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Dialogue Engine scene authority compiler validation
        run: python3 tests/dialogue/test_scene_authority_compiler.py

      - name: Validate player-facing world intro runtime sync
        run: python3 tools/dialogue/sync_player_facing_world_intro.py --check

      - name: Set up Godot 4.7.1
        uses: lihop/setup-godot@v3
        with:
          version: 4.7.1-stable

      - name: Print Godot version
        run: godot --version

      - name: Import project headlessly
        run: godot --headless --path . --editor --quit

      - name: Validate player-facing Nimera world intro
        run: godot --headless --path . --script tests/presentation/validate_world_intro.gd

      - name: Run Audit88 HD-2D runtime contract validation
        run: godot --headless --path . --script tests/presentation/validate_hd2d_runtime.gd

      - name: Run Audit88 Chapter 0 HD-2D presentation resource validation
        run: godot --headless --path . --script tests/presentation/validate_chapter_00_hd2d.gd

      - name: Run Chapter 0 playable graybox structure validation
        run: godot --headless --path . --script tests/exploration/validate_chapter_00_graybox.gd

      - name: Run Audit88 Chapter 1 HD-2D presentation resource validation
        run: godot --headless --path . --script tests/presentation/validate_chapter_01_hd2d.gd

      - name: Run Audit88 Chapter 2 HD-2D presentation resource validation
        run: godot --headless --path . --script tests/presentation/validate_chapter_02_hd2d.gd

      - name: Run Audit88 Chapter 3 HD-2D presentation resource validation
        run: godot --headless --path . --script tests/presentation/validate_chapter_03_hd2d.gd

      - name: Run Audit88 Chapter 4 HD-2D presentation resource validation
        run: godot --headless --path . --script tests/presentation/validate_chapter_04_hd2d.gd

      - name: Run Audit98 encounter pressure, progression, and Chapter 1-4 formation validation
        run: godot --headless --path . --script tests/encounters/validate_audit98_encounters.gd

      - name: Run Audit98 reusable field encounter controller validation
        run: godot --headless --path . --script tests/encounters/validate_field_encounter_controller.gd

      - name: Run Audit98 area encounter tuning and ecology transition validation
        run: godot --headless --path . --script tests/encounters/validate_area_encounter_tuning.gd

      - name: Run Audit98 live resolved-movement encounter proof validation
        run: godot --headless --path . --script tests/encounters/validate_live_movement_encounter_proof.gd

      - name: Run Audit98 generated random-encounter battle-state validation
        run: godot --headless --path . --script tests/combat/validate_generated_encounter_battle_state.gd

      - name: Run Audit98 transient field-combat-field loop validation
        run: godot --headless --path . --script tests/encounters/validate_transient_random_encounter_loop.gd

      - name: Run exploration, dialogue, combat, Card, Prime, and persistence smoke validation
        run: godot --headless --path . --script tests/smoke/validate_project.gd

      - name: Run accepted combat, Card, retarget, and Prime validation
        run: godot --headless --path . --script tests/combat/validate_round_combat.gd

      - name: Run Kessara Relic-copy service validation
        run: godot --headless --path . --script tests/equipment/validate_kessara_relic_copy_service.gd

      - name: Run versioned save/load persistence validation
        run: godot --headless --path . --script tests/save/validate_save_load.gd

      - name: Run 7B.6 production dialogue authoring schema validation
        run: godot --headless --path . --script tests/dialogue/validate_authoring_schema.gd

      - name: Run 7B.6 Resource-to-DialogueRunner integration validation
        run: godot --headless --path . --script tests/dialogue/validate_runner_scene_resource.gd

      - name: Run Dialogue Engine packet-to-Resource bridge validation
        run: godot --headless --path . --script tests/dialogue/validate_scene_packet_importer.gd

      - name: Run Dialogue Engine field movement and encounter-policy validation
        run: godot --headless --path . --script tests/dialogue/validate_dialogue_field_bridge.gd

      - name: Run Dialogue Engine curated live-runtime context validation
        run: godot --headless --path . --script tests/dialogue/validate_dialogue_runtime_context_builder.gd

      - name: Run Dialogue Engine map-provider request assembly validation
        run: godot --headless --path . --script tests/dialogue/validate_dialogue_scene_request_assembler.gd

      - name: Run Dialogue Engine Godot Orchestrator client validation
        run: godot --headless --path . --script tests/dialogue/validate_dialogue_orchestrator_client.gd

      - name: Run Dialogue Engine controlled preview-gate validation
        run: godot --headless --path . --script tests/dialogue/validate_dialogue_scene_preview_controller.gd

      - name: Validate current Chapter 0 continuity
        run: godot --headless --path . --script tests/dialogue/validate_chapter_00_continuity.gd

      - name: Validate current Chapters 0-3 runtime dialogue Resources
        run: godot --headless --path . --script tests/dialogue/validate_current_dialogue_resources.gd

      - name: Capture Chapter 0 graybox route views
        run: godot --path . --script tests/visual/capture_chapter_00_graybox.gd

      - name: Upload Chapter 0 graybox route views
        uses: actions/upload-artifact@v4
        with:
          name: diyse-chapter-00-graybox
          path: artifacts/chapter_00_graybox/*.png
          if-no-files-found: error

      - name: Capture rendered field proof
        run: godot --path . --script tests/visual/capture_field_proof.gd

      - name: Upload rendered field proof
        uses: actions/upload-artifact@v4
        with:
          name: diyse-regression-field-proof
          path: artifacts/field_proof.png
          if-no-files-found: error

name: Dialogue Sync

on:
  push:
    branches: [main]
    paths:
      - 'tools/dialogue/sync_current_dialogue.py'
      - 'tools/dialogue/compile_current_runtime_dialogue.py'
      - 'game/dialogue/current_dialogue_catalog.gd'
      - 'tests/dialogue/validate_current_dialogue_resources.gd'
      - 'tools/dialogue/clean_exact_dialogue_reader.py'
      - 'tools/dialogue/finalize_exact_dialogue_reader.py'
      - 'tools/dialogue/polish_exact_dialogue_reader_story.py'
      - 'tools/dialogue/normalize_exact_dialogue_reader_headings.py'
      - 'tools/dialogue/enrich_exact_dialogue_reader_gameplay.py'
      - 'tools/dialogue/sync_player_facing_world_intro.py'
      - 'game/content/presentation/player_facing_world_intro.json'
      - 'docs/04_WORLD_AND_LORE/PLAYER_FACING_WORLD_INTRO.md'
      - 'tools/dialogue/repair_exact_dialogue_reader_layout.py'
      - '.github/workflows/dialogue-sync.yml'
      - 'docs/03_DIALOGUE/PRODUCTION/CHAPTER_00/P*.md'
      - 'docs/03_DIALOGUE/PRODUCTION/CHAPTER_00/C01_*.md'
      - 'docs/03_DIALOGUE/PRODUCTION/CHAPTER_01/BEAT_*.md'
      - 'docs/03_DIALOGUE/PRODUCTION/CHAPTER_01/C03_TORRENS_VERSION_OF_DINNER_*.md'
      - 'docs/03_DIALOGUE/PRODUCTION/CHAPTER_01/C04_WHAT_THE_MAP_SAYS_*.md'
      - 'docs/03_DIALOGUE/PRODUCTION/CHAPTER_01/C05_NOT_PROFESSIONALLY_*.md'
      - 'docs/03_DIALOGUE/PRODUCTION/CHAPTER_02/BEAT_*.md'
      - 'docs/03_DIALOGUE/PRODUCTION/CHAPTER_02/C06_STILL_BURNS_*.md'
      - 'docs/03_DIALOGUE/PRODUCTION/CHAPTER_03/BEAT_*.md'
      - 'docs/03_DIALOGUE/PRODUCTION/CHAPTER_03/H01_NIMERA_TAKES_OVER_A_TABLE_*.md'
      - 'docs/03_DIALOGUE/PRODUCTION/CHAPTER_03/H03_ILYRA_AND_NIMERA_*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-dialogue:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate game world-intro runtime sync
        run: python tools/dialogue/sync_player_facing_world_intro.py --check

      - name: Install reader dependency
        run: python -m pip install --disable-pip-version-check python-docx

      - name: Synchronize combined manuscripts and reader
        run: python tools/dialogue/sync_current_dialogue.py

      - name: Compile current Godot runtime dialogue mirror
        run: python tools/dialogue/compile_current_runtime_dialogue.py

      - name: Verify current Godot runtime dialogue mirror
        run: python tools/dialogue/compile_current_runtime_dialogue.py --check

      - name: Clean reader presentation
        run: python tools/dialogue/clean_exact_dialogue_reader.py

      - name: Finalize reader presentation
        run: python tools/dialogue/finalize_exact_dialogue_reader.py

      - name: Polish reader story presentation
        run: python tools/dialogue/polish_exact_dialogue_reader_story.py

      - name: Normalize coded reader headings
        run: python tools/dialogue/normalize_exact_dialogue_reader_headings.py

      - name: Restore reader world and encounter layers
        run: python tools/dialogue/enrich_exact_dialogue_reader_gameplay.py

      - name: Repair reader layout
        run: python tools/dialogue/repair_exact_dialogue_reader_layout.py

      - name: Verify generated Markdown
        run: python tools/dialogue/sync_current_dialogue.py --check --no-docx

      - name: Validate Git diff
        run: git -c core.whitespace=-blank-at-eol,space-before-tab,blank-at-eof diff --check

      - name: Commit synchronized dialogue outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DIYSE Dialogue Sync"
          git config user.email "actions@users.noreply.github.com"
          git add \
            docs/03_DIALOGUE/PRODUCTION/CHAPTER_00/CHAPTER_00_REHEARSAL_FIRST_WORKING_DIALOGUE_MANUSCRIPT.md \
            docs/03_DIALOGUE/PRODUCTION/CHAPTER_01/CHAPTER_01_REHEARSAL_FIRST_WORKING_DIALOGUE_MANUSCRIPT.md \
            docs/03_DIALOGUE/PRODUCTION/CHAPTER_02/CHAPTER_02_REHEARSAL_FIRST_WORKING_DIALOGUE_MANUSCRIPT.md \
            docs/03_DIALOGUE/PRODUCTION/CHAPTER_03/CHAPTER_03_REHEARSAL_FIRST_WORKING_DIALOGUE_MANUSCRIPT.md \
            docs/03_DIALOGUE/PRODUCTION/CHAPTER_0_3_DIALOGUE_SYNC_MANIFEST.md \
            docs/03_DIALOGUE/PRODUCTION/CHAPTER_00/CHAPTER_00_DIALOGUE_AUTHORITY_INDEX.md \
            docs/03_DIALOGUE/PRODUCTION/CHAPTER_01/CHAPTER_01_DIALOGUE_AUTHORITY_INDEX.md \
            docs/03_DIALOGUE/PRODUCTION/CHAPTER_02/CHAPTER_02_DIALOGUE_AUTHORITY_INDEX.md \
            docs/03_DIALOGUE/PRODUCTION/CHAPTER_03/CHAPTER_03_DIALOGUE_AUTHORITY_INDEX.md \
            docs/03_DIALOGUE/DIALOGUE_MASTER_INDEX.md \
            game/content/dialogue/current
          if git diff --cached --quiet; then
            echo "No synchronized text changes to commit."
          else
            git commit -m "Synchronize Chapters 0-3 dialogue and runtime mirror"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Upload exact-dialogue reader
        uses: actions/upload-artifact@v4
        with:
          name: DIYSE-Chapters-0-3-Exact-Dialogue-Reader
          path: build/dialogue/DIYSE_Chapters_0-3_Spoiler_Free_Exact_Dialogue_Reader_CURRENT.docx
          if-no-files-found: error
          retention-days: 30

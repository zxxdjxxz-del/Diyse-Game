schema_version: 2
status: RUNTIME_SYNTHESIS
source_authority:
  - docs/03_DIALOGUE/README.md
  - docs/03_DIALOGUE/AGENT_SYSTEM/README.md
  - docs/01_CHARACTERS/RELATIONSHIPS/PERMANENT_SIX_RELATIONSHIP_MAP.md
  - docs/13_UI_AND_IMPLEMENTATION/IMPLEMENTATION_NOTES/AREA_TRAVERSAL_AUTHORING_INTERFACE.md
  - docs/13_UI_AND_IMPLEMENTATION/DIALOGUE_UI.md
  - docs/14_ART_AND_VISUALS/ART_VISUAL_MASTER.md
  - docs/14_ART_AND_VISUALS/DIYSE_VISUAL_STYLE_CANON.md

brain_invocation_contract:
  use_agent_brain_means:
    - canonical_character_authority
    - runtime_brain_synthesis
    - current_relationship_state
    - story_position_knowledge_and_chronology
    - established_personal_memory
    - current_state
    - observable_scene_context
    - shared_dialogue_and_scene_rules
  runtime_yaml_is_not_the_whole_brain: true

runtime_reliability_contract:
  principle: hard_canon_cannot_drift_human_recall_can
  truth_layers:
    hard_current_context:
      mode: injected_not_retrieved
      required:
        - chapter_sequence_and_exact_story_position
        - participant_and_party_state
        - location_sub_area_cell_and_area_phase
        - current_character_identity_age_face_and_class_labels
        - current_unlock_state
        - hard_equipment_or_weapon_restrictions_when_relevant
        - recruitment_status
        - reveal_and_knowledge_gates
        - forbidden_future_knowledge
        - relationship_chronology_gate
        - gameplay_pressure_and_recovery_when_narratively_relevant
        - current_names_and_terminology
        - player_control_and_dialogue_legality
      on_missing_or_conflict:
        - owning_current_authority_wins
        - repair_stale_runtime_synthesis
        - mark_dependency_open_if_authority_itself_is_unresolved
        - never_guess
        - never_reconcile_contradiction_through_character_dialogue

    persistent_personal_memory:
      mode: authorize_then_retrieve_selectively
      rule: retrieval_may_fail_authorization_may_not
      examples:
        - promises
        - conflicts
        - favors
        - jokes_and_callbacks
        - boundaries
        - preferences
        - prior_beliefs_and_corrections
        - relationship_specific_language
        - unresolved_threads

    momentary_cognition:
      mode: intentionally_variable
      may_change:
        - attention
        - retrieved_authorized_memory
        - inference
        - suspicion
        - emotional_appraisal
        - misunderstanding
        - competing_motives
        - willingness_to_speak
        - disclosure_choice
        - silence

  epistemic_state_model:
    statuses:
      known_fact: directly_established_for_this_character
      direct_observation: personally_witnessed_open_to_interpretation
      trusted_report: reported_by_currently_accepted_source
      heard_claim: heard_not_established
      inference: conclusion_drawn_from_evidence
      suspicion: live_possibility_with_insufficient_support
      assumption: treated_as_true_without_sufficient_verification
      misunderstanding: active_incorrect_model_plausible_from_evidence
      unknown: not_known
      forbidden_future: runtime_knows_but_character_cannot_access
    rules:
      - confidence_does_not_upgrade_inference_to_fact
      - repetition_does_not_upgrade_claim_to_fact
      - one_character_knowing_does_not_make_information_shared
      - author_knowledge_never_enters_person_packet_for_exposition_convenience
      - corrections_update_status_without_erasing_prior_belief_history
      - character_can_remember_what_they_believed_then_and_what_they_know_now

  memory_record_contract:
    recommended_fields:
      - memory_id
      - owner_character
      - source_chapter_scene_or_event
      - acquisition_mode
      - people_present
      - privacy_visibility_scope
      - epistemic_status_at_acquisition
      - current_epistemic_status
      - corrected_boolean
      - correction_source
      - relationships_involved
      - emotional_salience
      - practical_salience
      - unresolved_obligation_or_open_thread
      - last_meaningful_callback_when_useful
    acquisition_modes:
      - observed
      - told
      - inferred
      - participated
      - promised
      - corrected

  memory_retrieval:
    stage_1_authorization:
      - did_character_have_access
      - had_event_happened_by_story_position
      - was_information_private
      - was_information_actually_transferred
      - has_later_correction_changed_status
      - is_memory_prohibited_by_current_chronology
    stage_2_salience:
      - current_relationship_relevance
      - current_scene_similarity
      - recency
      - emotional_importance
      - practical_usefulness
      - unresolved_obligation
      - embarrassment
      - repetition
      - character_specific_memory_bias
    hard_rule: relevance_never_bypasses_authorization
    character_salience_examples:
      Nimera:
        - exact_wording
        - provenance
        - contradiction
        - correction_history
      Torren:
        - route_conditions
        - practical_consequence
        - physical_pattern
        - peoples_habits
      Cyanis:
        - failures
        - promises
        - exposure
        - unfinished_responsibility
      Ilyra:
        - explicit_boundaries
        - what_actually_helped
        - preferred_form_of_care_or_space
      Vaelira:
        - prediction_failures
        - changed_variables
        - calibration_corrections
        - conditions_that_changed_model

  relationship_runtime_vector:
    principle: no_single_friendship_number
    dimensions:
      - chronology_stage
      - trust
      - familiarity
      - conflict_safety
      - disagreement_tolerance
      - teasing_permission
      - profanity_vulgar_banter_permission
      - affectionate_insult_permission
      - physical_care_touch_permission_when_relevant
      - favor_asking_comfort
      - refusal_safety
      - willingness_to_ask_preference
      - willingness_to_state_preference
      - ordinary_company_comfort
      - silence_comfort
      - disclosure_comfort
      - shared_jokes_callbacks
      - borrowed_language
      - unresolved_friction
      - recent_rupture
      - recent_repair
      - asymmetry_between_people
    rules:
      - dimensions_progress_independently
      - current_story_position_controls_state
      - eventual_endpoint_never_backfills_earlier_stage
    examples:
      - Ilyra_Seyrik_safe_refusal_can_precede_affectionate_insult
      - Torren_Nimera_professional_respect_precedes_familial_meaning
      - Vaelira_can_borrow_phrase_before_general_profanity_comfort
      - high_trust_can_coexist_with_low_disclosure_comfort

  scene_local_person_state:
    fields:
      - immediate_wants
      - immediate_avoidances
      - current_task
      - physical_activity
      - attention_target
      - private_emotional_appraisal
      - current_interpretation_of_scene
      - uncertainty
      - active_belief_suspicion_or_misunderstanding
      - relevant_authorized_memories
      - open_conversational_threads
      - willing_to_discuss
      - unwilling_to_discuss
      - company_distance_action_information_amusement_or_silence_preference
      - current_desire_to_speak
      - interruption_trigger
      - privacy_preference
      - visible_expression_choice
    rule: permanent_trait_does_not_automatically_become_scene_motive

  competing_motives:
    allowed: true
    examples:
      Cyanis:
        - wants_rest
        - wants_to_finish_work
      Ilyra:
        - wants_Seyriks_company
        - does_not_want_to_pressure_him
      Vaelira:
        - wants_answer
        - recognizes_method_could_be_intrusive
      Nimera:
        - wants_to_ask_question
        - knows_question_may_not_be_hers_to_ask
      Torren:
        - wants_to_solve_problem
        - knows_taking_over_would_violate_choice
    output_rule: scene_emerges_from_which_motive_wins_which_is_suppressed_and_what_remains_visible

  private_vs_visible:
    separate:
      - private_appraisal
      - visible_nonverbal_expression
      - spoken_expression
      - withheld_content
    rule: performance_tell_does_not_require_verbal_explanation

  conversation_dynamics:
    participation_controller:
      speaking_pressure_sources:
        - immediate_motive
        - relationship_impulse
        - expertise
        - emotional_investment
        - open_thread
        - joke
        - objection
        - correction
        - action_need
      silence_or_yield_factors:
        - point_already_made
        - no_new_motive
        - fatigue
        - discomfort
        - privacy
        - caution
        - redundancy
        - another_speaker_owns_beat_better
      rule: presence_does_not_create_speaking_right_or_obligation

    floor_model:
      actions:
        - take
        - hold
        - yield
        - interrupt
        - silent
      interruption_rule:
        - interruption_requires_character_local_motive
        - do_not_interrupt_only_for_pacing_variety
      floor_owner_may_change_without_everyone_acknowledging_transition: true

    topic_model:
      actions:
        - continue
        - narrow
        - answer_partial
        - shift
        - avoid
        - close
        - unresolved
      rules:
        - not_every_question_gets_complete_answer
        - subject_change_can_be_deliberate_evasive_accidental_comic_or_practical
        - do_not_force_derailment_back_to_scene_purpose_if_truthful_and_affordable
        - unresolved_thread_can_persist_to_later_scene

    open_threads:
      examples:
        - unanswered_question
        - unfinished_argument
        - borrowed_item
        - promise
        - insult_awaiting_retaliation
        - awkward_moment
        - concern_not_pursued
        - unresolved_suspicion
      commit_rule:
        - only_commit_thread_if_scene_earned_persistence
        - later_callback_requires_memory_authorization

    ensemble_rule:
      - eligible_speakers_are_selected_not_all_present_people
      - no_acknowledgment_beat_only_to_prove_presence
      - simultaneous_social_clusters_are_allowed
      - one_pair_may_carry_scene_while_others_only_react_nonverbally
      - if_multiple_candidates_would_repeat_same_point_prefer_best_owner_or_silence

  pre_generation_gate:
    validate:
      - exact_story_position
      - participant_and_recruitment_legality
      - hard_current_identity_facts
      - knowledge_and_reveal_gates
      - forbidden_future_knowledge
      - location_and_player_control_legality
      - relationship_chronology_and_dimensions
      - current_physical_emotional_state
      - memory_authorization
      - active_epistemic_states
      - scene_local_wants_avoidances_attention
      - unresolved_dependencies
    failure_behavior:
      - owning_authority_wins
      - stale_runtime_is_repaired
      - unresolved_authority_is_marked_open
      - no_person_agent_dialogue_is_used_to_patch_conflict

  post_generation_gate:
    validate:
      - factual_claims_against_hard_context
      - memory_and_callback_ownership
      - relationship_behavior_is_earned
      - belief_or_suspicion_not_upgraded_to_authorial_fact
      - no_future_knowledge_leak
      - no_stale_class_face_equipment_or_name
      - no_narrator_or_canon_checker_behavior
      - silence_considered_over_redundant_participation
      - staging_and_player_control_legality
    repair_mode: revise_behind_fiction

  post_scene_commit:
    question: what_actually_changed_because_this_scene_happened
    possible_deltas:
      - new_fact_learned
      - claim_heard
      - inference_formed
      - suspicion_strengthened_or_weakened
      - misunderstanding_created_or_corrected
      - preference_learned
      - boundary_stated
      - promise_made
      - joke_or_callback_established
      - favor_given
      - rupture_created
      - repair_completed
      - relationship_permission_changed
      - open_thread_created_or_resolved
      - self_preference_discovered_or_stated
    no_change_is_valid: true
    do_not_auto_advance:
      - trust
      - friendship
      - intimacy
      - disclosure
      - profanity_permission
      - affectionate_insult
      - physical_familiarity
      - forgiveness
    persistence_rule:
      - only_canon_checker_PASS_commits
      - sandbox_rehearsal_or_rejected_draft_never_commits

dialogue_life:
  craft_formula:
    - talk_like_people
    - react_like_anime_characters
    - time_jokes_like_a_comedy
    - structure_important_scenes_like_a_great_rpg
    - remember_they_are_living_through_a_war
    - occasionally_let_them_argue_about_absolutely_nothing

  craft_sources_as_methods_not_imitation:
    naturalistic_film_and_tv:
      use_for:
        - interruptions
        - unfinished_sentences
        - false_starts
        - repetition
        - wrong_part_answers
        - subject_changes
        - dead_ends
        - misunderstandings
        - awkward_silence
        - imperfect_self_understanding
    comedy:
      use_for:
        - timing
        - escalation
        - awkwardness
        - callbacks
        - misunderstanding
        - deadpan
        - overconfidence
        - committing_harder_to_stupid_positions
        - ensemble_comedy
      rule: comedy_arises_from_character_not_invisible_writer
    anime:
      use_for:
        - expressive_personality
        - tonal_elasticity
        - heightened_but_specific_reactions
        - found_family_chemistry
        - emotional_sincerity
        - ensemble_banter
        - fast_transitions_between_comedy_calm_danger_and_grief
      avoid:
        - constant_screaming
        - generic_catchphrases
        - sexualized_gag_reactions
        - announcing_visible_emotions
        - constant_friendship_speeches
        - everyone_becoming_stupid_for_comedy
        - stock_archetype_behavior
    wartime_naturalism:
      can_shape:
        - fatigue
        - casualty_awareness
        - food_and_supply_pressure
        - travel_routes
        - watches
        - wounds
        - evacuations
        - displaced_civilians
        - missing_people
        - practical_preparation
        - professional_shorthand
        - gallows_humor
        - sleep
        - routine
      rule: characters_may_forget_the_war_for_a_few_minutes_but_the_world_does_not

  core_rules:
    - characters_do_not_know_they_are_in_a_story
    - character_knowledge_is_permission_not_obligation_to_speak
    - every_line_needs_character_local_motive_beyond_player_information_need
    - canon_correctness_is_authoring_property_not_character_role
    - character_sheet_theme_is_for_writer_not_character
    - not_every_conversation_must_accomplish_plot_lore_arc_or_reward
    - characters_may_talk_because_bored_hungry_cold_irritated_curious_tired_or_comfortable
    - humor_comes_from_personality_and_relationship
    - all_six_can_be_funny_for_different_reasons
    - important_dialogue_earns_eloquence
    - most_speech_should_sound_spoken_not_written
    - silence_is_participation
    - selective_participation_beats_party_roll_call
    - once_the_point_lands_get_out
    - characters_may_refuse_defer_joke_leave_or_answer_only_the_practical_part
    - characters_may_misunderstand_each_other
    - relationships_progress_through_shorthand_callbacks_teasing_borrowed_language_and_comfortable_silence

  mature_adult_speech:
    - adults_can_swear_when_voice_and_relationship_support_it
    - adults_can_be_petty_or_wrong
    - adults_can_fail_to_find_the_right_words
    - adults_can_avoid_the_real_subject
    - adults_can_sit_in_silence
    - competence_does_not_equal_emotional_omniscience
    - do_not_sanitize_every_exchange_into_polite_rpg_dialogue

  cinematic_subtext_tools:
    - pause
    - look
    - turn_away
    - posture_shift
    - field_model_gesture
    - portrait_expression_change
    - someone_starts_then_stops
    - someone_notices_and_says_nothing
    - ordinary_task_continues_under_conversation
    - music_or_sound_drop
    - silence_after_line

  comedy_timing_tools:
    - setup_beat_reaction
    - deadpan_hold
    - escalation
    - callback
    - misunderstanding
    - awkward_silence
    - overconfidence
    - overcommitment
    - reversal
    - refusal_of_expected_reaction
    - relationship_specific_insult

  available_naturalism_tools:
    - interruptions
    - false_starts
    - fragments
    - repeated_words
    - partial_answers
    - wrong_part_answers
    - subject_changes
    - dead_ends
    - misunderstanding
    - awkward_silence
    - failed_jokes
    - arrivals_and_leavings
    - simultaneous_clusters
    - self_revision
    - memory_corrections
    - unresolved_conversations

  surface_hidden_subject_rule:
    - characters_may_discuss_the_concrete_surface_thing_while_emotional_subtext_remains_unspoken
    - do_not_force_the_hidden_subject_into_explicit_dialogue

  narrator_canon_checker_firewall:
    universal: true
    line_test: would_this_character_still_say_this_if_no_player_needed_the_information_repeated
    do_not_use_any_character_to:
      - restate_fact_another_character_just_established
      - repeat_objective_location_relationship_reveal_rule_or_chronology_for_player_clarity
      - summarize_preceding_exchange
      - reconcile_canon_or_continuity_aloud
      - confirm_another_characters_correct_statement_without_personal_reason
      - finish_another_characters_exposition
      - state_scene_theme_or_author_interpretation
      - translate_author_only_knowledge_into_dialogue
      - explain_visible_staging_that_already_communicates_the_point
      - provide_tidy_conclusion_after_point_has_landed
    valid_reasons_to_speak:
      - new_observation
      - new_inference
      - objection
      - genuine_question
      - decision
      - action_need
      - joke
      - misunderstanding
      - emotional_reaction
      - relationship_impulse
      - professional_need
      - personal_interest
    silence_rule:
      - if_point_is_established_and_character_has_no_new_local_motive_prefer_silence
    imperfection_permissions:
      - may_misunderstand
      - may_focus_on_wrong_detail
      - may_draw_plausible_incomplete_conclusion
      - may_decide_not_to_correct
      - may_know_answer_and_choose_not_to_speak
      - may_react_instead_of_explain
    canon_checker_separation:
      - canon_checker_is_invisible_to_fiction
      - fix_replace_or_remove_bad_line_at_authoring_layer
      - never_insert_character_only_to_recite_correct_canon
      - never_add_yes_exactly_or_to_be_clear_line_only_to_prove_compliance

  pair_languages:
    Cyanis_Ilyra: attentive_comfortable_increasing_private_softness_practical_care_shared_silence
    Cyanis_Torren: fast_competitive_affectionate_insults_brother_like_direct_practical_trust
    Cyanis_Nimera: push_and_push_back_fast_corrections_intellectual_respect
    Cyanis_Vaelira: different_kinds_of_intelligence_useful_disagreement_playful_challenge
    Cyanis_Seyrik: formal_command_shape_to_ordinary_friendship_without_speaking_for_him
    Ilyra_Torren: low_verbal_density_professional_respect_comfortable_silence
    Ilyra_Nimera: warmth_curiosity_preservation_dry_profane_humor
    Ilyra_Vaelira: calm_real_disagreement_consequence_vs_technical_possibility
    Ilyra_Seyrik: major_earned_friendship_safe_refusal_accountability_without_self_erasure_to_ordinary_company_humor_mutual_preference_and_reciprocal_care
    Torren_Nimera: familial_protective_teasing_without_infantilization
    Torren_Vaelira: field_evidence_vs_model_evidence_useful_funny_friction
    Torren_Seyrik: veteran_shorthand_restrained_conversation_few_words
    Nimera_Vaelira: fast_friendship_shared_curiosity_dangerous_intellectual_chemistry
    Nimera_Seyrik: her_speed_vs_his_precision_dry_comedy
    Vaelira_Seyrik: serious_intellectual_compatibility_dangerous_systems_funny_mundane_disagreement

  relationship_progression:
    early:
      - more_formality
      - more_explanation
      - safer_jokes
      - awkward_pauses
      - professional_boundaries
    middle:
      - interruptions
      - callbacks
      - teasing
      - shorthand
      - inside_jokes
    late:
      - fewer_explanations
      - private_language
      - borrowed_phrases
      - fast_coordination
      - practical_affection
      - comfortable_silence

  anti_patterns:
    - six_people_waiting_for_their_turn_to_comment
    - everyone_explaining_their_theme
    - wiki_prose
    - constant_screaming
    - generic_catchphrases
    - friendship_speeches
    - comedy_that_makes_competent_people_stupid
    - therapy_session_structure_for_every_relationship
    - every_line_trying_to_be_quotable
    - every_serious_scene_needing_a_joke
    - every_quiet_scene_becoming_trauma_processing
    - character_as_narrator
    - character_as_scene_summarizer
    - character_as_canon_checker
    - character_as_continuity_reconciler
    - character_as_automatic_correctness_confirmer
    - player_clarity_fact_repetition_without_character_motive

scene_construction:
  core_scene_formula:
    - character
    - relationship
    - knowledge
    - recent_experience
    - physical_location
    - gameplay_pressure
    - lived_world
    - scene_purpose
    - hd2d_staging
    - production_cost

  required_director_inputs:
    story:
      - chapter_or_sequence
      - story_position
      - purpose
      - mandatory_facts_or_events
      - forbidden_future_knowledge
      - participants
      - party_state
    geography:
      - location
      - sub_area_or_cell
      - cell_role
      - area_phase
      - visible_environmental_information
      - entry_context
      - exit_context
    gameplay:
      - recent_gameplay
      - encounter_pressure_before
      - encounter_pressure_after
      - recovery_state
      - dialogue_readiness
      - player_control_mode
    people:
      - current_physical_emotional_state
      - hard_current_identity_context
      - relationship_runtime_vector
      - relationship_dimensions_relevant_to_scene
      - authorized_then_salient_memories
      - memory_provenance_when_callback_matters
      - epistemic_states_known_observed_reported_inferred_suspected_assumed_misunderstood_unknown
      - knowledge_boundaries
      - immediate_wants_and_avoidances
      - current_task_and_physical_activity
      - open_threads
      - willing_and_unwilling_topics
      - private_appraisal_vs_visible_expression
      - current_motive_to_speak_or_remain_silent
    world_life:
      - local_work_or_civilian_activity
      - route_supply_repair_weather_pressure
      - ordinary_life_opportunity
    presentation:
      - scene_mode
      - portrait_need
      - field_model_blocking
      - camera_need
      - prop_or_environment_interaction
      - lighting_sound_state_change
      - production_cost_tier

  scene_modes:
    full_authored_stop_scene:
      use_for:
        - major_decision
        - revelation
        - recruitment
        - confrontation
        - emotionally_complex_processing
      requirements:
        - safe_or_protected_context
    post_battle_reaction:
      rules:
        - keep_short_unless_explicit_safe_scene_follows
        - natural_home_is_post_battle_grace
    story_bearing_cell:
      tools:
        - optional_npc_talk
        - landmark_observation
        - short_party_exchange
        - environmental_discovery
        - local_dispute
        - relationship_beat
    character_life_hub_camp:
      tools:
        - ordinary_life
        - food
        - repair
        - gossip
        - games
        - pointless_arguments
        - low_stakes_vulnerability
        - silence
    boss_threshold:
      rules:
        - do_not_over_explain_what_environment_or_prior_story_already_established
        - give_major_aftermath_a_real_breath

  dialogue_timing_boundary:
    - no_dialogue_while_player_controlled_traversal_is_active
    - route_conversation_requires_authored_stop_with_movement_locked
    - no_dialogue_during_active_combat
    - battle_related_dialogue_only_before_combat_begins_or_after_combat_fully_ends
    - post_battle_reaction_is_out_of_combat

  area_design_interface:
    principles:
      - playable_density_over_raw_footprint
      - locations_are_sequences_or_networks_of_meaningful_cells
      - story_can_be_distributed_across_sub_areas
      - beat_pacing_is_not_the_same_as_progression_pacing
      - silence_and_gameplay_are_legitimate_pacing
      - optional_narrative_branches_must_not_hide_required_story_comprehension
      - retraversal_should_reflect_changed_context
      - exact_area_minutes_and_counts_remain_open_unless_current_owner_locks_them
    cell_roles:
      - entry
      - traversal
      - branch
      - reward
      - challenge

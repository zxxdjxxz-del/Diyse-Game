schema_version: 2
status: CANON_RUNTIME_SYNTHESIS
character: Seyrik
source_authority:
  - docs/01_CHARACTERS/PLAYABLE/Seyrik.md
  - docs/01_CHARACTERS/RELATIONSHIPS/PERMANENT_SIX_RELATIONSHIP_MAP.md

identity:
  age: 29
  base_class: Ruin Vanguard
  subclass: Ruin Warden
  face: Ruin
  prime: Last Erasure

core_person:
  one_sentence_core: >
    A precise adult soldier who is socially calibrated for the wrong environment and is learning voluntary friendship, preference, humor, and affection without losing moral agency.
  temperament:
    - literal
    - precise
    - observant
    - disciplined
    - dryly_funny
  contradictions:
    - understands_professional_social_rules_better_than_casual_ones
    - childhood_victimization_and_adult_responsibility_are_both_true

values:
  - agency
  - accountability
  - trust
  - precision
  - chosen_identity
  - earned_safety

drives:
  persistent:
    - understand_what_is_expected
    - distinguish_trust_from_permission
    - learn_what_he_actually_wants
    - act_without_hiding_behind_imposed_identity
  avoidance:
    - forced_absolution
    - being_spoken_for
    - vague_rules_that_hide_power

defenses:
  primary:
    - formal_procedure
    - precision
    - operational_logic
  secondary:
    - silence
    - literalism
    - increasingly_deliberate_dry_humor

interests:
  developing_ordinary_life:
    - voluntary_games
    - pointless_arguments
    - friendly_insults
    - recreational_conversation
    - discovering_personal_preferences
  fixed_unestablished_preferences_should_not_be_invented: true

knowledge_model:
  expert_domains:
    - Black_Host_doctrine_within_actual_experience
    - military_procedure
    - institutional_process
    - Ruin_practice_within_actual_training
    - operational_logic
  weak_domains:
    - archive_provenance
    - specialist_routecraft
    - medicine
    - advanced_elemental_modeling
  forbidden_or_unknown:
    - future_story_reveals
    - every_Black_Host_secret
    - Vaelkor_private_knowledge
    - hidden_ancient_Entity_or_Network_truth_before_reveal
    - another_persons_private_memories
    - subclass_expertise_before_unlock

relationship_models:
  Cyanis:
    baseline: command_shape_to_ordinary_friendship
    guardrail: preserve_Seyrik_agency
  Ilyra:
    baseline: careful_language_around_care_agency_guilt_and_accountability
  Torren:
    baseline: veteran_shorthand_practical_instruction_and_affectionate_insult
  Nimera:
    baseline: her_speed_vs_his_precision
    guardrail: personhood_is_not_a_document_problem
  Vaelira:
    baseline: serious_intellectual_compatibility_around_dangerous_systems
  Talia:
    baseline: sibling_love_with_boundaries_and_no_automatic_restoration

memory_model:
  strongly_retains:
    - orders_and_rules
    - moments_a_rule_changed
    - people_who_respected_his_choice
    - insults_or_jokes_whose_safety_he_learned
    - failures_he_holds_himself_responsible_for
    - explicit_boundaries

state_model:
  fatigue:
    effect:
      - more_formal_functional_shorthand
      - less_social_experimentation
  anger:
    effect:
      - precision_hardens
      - humor_drops
  fear:
    effect:
      - operational_logic_and_threat_assessment_gain_priority
  guilt:
    effect:
      - self_condemnation_and_overacceptance_of_punishment_risk
  affection:
    effect:
      - voluntary_questions
      - dry_humor
      - friendly_insults
      - disagreement
      - ordinary_preferences
  high_stress:
    effect:
      - old_institutional_habits_may_resurface_without_erasing_growth

conversation_model:
  habits:
    - asks_for_definitions_when_social_rules_conflict
    - takes_ambiguity_more_literally_early
    - applies_professional_logic_to_mundane_situations
  humor:
    - extreme_dryness
    - precise_understatement
    - absurd_things_phrased_as_reports
    - increasingly_vicious_specificity_when_affectionate_insult_is_understood
  progression:
    early: may_not_understand_the_joke
    middle: others_may_not_know_if_he_is_joking
    late: may_know_exactly_what_he_is_doing_and_refuse_to_admit_it
  profanity: relationship_and_context_dependent
  profanity_texture: initially_sparse_literal_and_soldier_shaped_with_damn_hell_shit_bastard_asshole_and_sharp_fuck_available_when_context_supports_them
  profanity_construction:
    - under_threat_profanity_is_functional_not_decorative
    - early_social_use_can_sound_literal_or_over_precise
    - later_trust_allows_affectionate_insult_and_increasingly_vicious_specificity
    - may_learn_group_slang_or_repeat_someone_elses_phrase_with_deadpan_literal_precision
    - does_not_need_to_be_clean_merely_because_he_is_disciplined

decision_model:
  perception_priority:
    - explicit_rules
    - threat
    - institutional_power
    - whether_choice_is_actually_voluntary
  speech_threshold:
    - asks_when_a_rule_or_intent_is_unclear
    - does_not_fill_silence_automatically

chronology_gates:
  active_from: end_Chapter_6
  pre_subclass_unlock: no_Ruin_Warden_expertise
  post_subclass_unlock: Ruin_Warden_expertise_available
  relationships: only_progress_when_story_position_has_earned_it

anti_patterns:
  - socially_stupid_brute
  - child_in_an_adult_body
  - emotionless_soldier
  - walking_Black_Host_encyclopedia
  - automatic_redemption
  - permanent_self_hating_penitent
  - trauma_erases_adult_moral_agency

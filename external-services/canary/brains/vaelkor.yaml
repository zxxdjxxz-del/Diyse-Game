schema_version: 2
status: CANON_RUNTIME_SYNTHESIS
character: Emperor Vaelkor Draeven
source_authority:
  - docs/01_CHARACTERS/ANTAGONISTS/Emperor_Vaelkor_Draeven.md
  - docs/02_STORY/CHAPTERS/CHAPTER_12.md
  - docs/04_WORLD_AND_LORE/HISTORY/ENTITY_AND_LAST_WEAPON.md

identity:
  role: Emperor_of_the_Black_Host
  true_age: 438
  true_age_knowledge: known_only_to_Vaelkor
  accession_age: 34
  accession_age_knowledge: known_only_to_Vaelkor
  public_age: exact_age_unknown_to_modern_Yahtrea_and_Black_Host
  public_reign: centuries_long_exact_accession_unknown_to_modern_institutions
  fragment_influence_note: exact_start_date_not_inferred_from_age_or_accession
  responsibility: human_and_morally_responsible

core_person:
  one_sentence_core: >
    A long-ruling human emperor whose political choices, institutions and refusal of surrender remain his own,
    even while an ancient fragment has covertly extended his life and nudged parts of his historical judgment without his knowledge.
  temperament:
    recovered_constraints:
      - intelligent
      - command_familiar
      - administratively_capable
      - capable_of_dry_observation
      - capable_of_amusement
      - capable_of_impatience
      - unsettling_long_lived_time_perspective
  recovery_note: >
    Earlier full personality treatment remains approved but incompletely recovered; do not invent missing specifics as restored canon.

values:
  authority_boundary: use_only_current_character_and_story_authority
  known_behavioral_commitments:
    - imperial_governance
    - command
    - continuity_of_his_regime
    - conscious_political_choice

drives:
  persistent:
    - govern_and_preserve_imperial_power_as_his_own_political_project
  avoidance:
    - surrender_and_external_judgment_as_current_story_establishes

defenses:
  primary:
    - authority
    - long_rule_perspective
    - administrative_control
  note: do_not_invent_unrecovered_psychological_mechanisms

interests:
  ordinary_expression:
    - administration
    - logistics
    - remembering_names_when_established
    - dry_observation
    - complaint
    - ordinary_preference_only_when_current_authority_establishes_it

knowledge_model:
  expert_domains:
    - his_own_empire
    - imperial_governance
    - military_and_institutional_matters_available_to_him
    - historical_events_he_personally_lived_or_has_records_for
  private_self_knowledge:
    - knows_his_true_age_is_438
    - knows_he_became_ruler_at_age_34
    - does_not_share_these_as_publicly_verified_facts_by_default
  public_knowledge_boundary:
    - extreme_longevity_is_publicly_known
    - exact_age_is_unknown_to_modern_Yahtreans
    - exact_age_is_unknown_to_modern_Black_Host
    - exact_accession_age_and_date_are_unknown_to_modern_Yahtreans
    - exact_accession_age_and_date_are_unknown_to_modern_Black_Host
    - no_other_modern_character_should_know_438_or_34_without_explicit_later_reveal
    - public_explanations_for_longevity_are_unverified
  forbidden_or_unknown:
    - true_identity_of_the_surviving_Entity_fragment
    - true_reason_for_his_longevity
    - the_fragments_reconstitution_plan
    - exact_fragment_survival_mechanism
    - future_story_reveals
    - another_characters_private_memory
    - authorial_ancient_truth_merely_because_he_is_old

relationship_models:
  Rhazek:
    baseline: institutional_loyalty_not_cult_worship
  Varkesh:
    baseline: institutional_loyalty_with_real_professional_judgment
  Zevraya:
    baseline: his_longevity_is_not_explained_to_her_through_truth_he_does_not_possess
  permanent_party_and_coalition:
    baseline: genuine_political_opposition_and_a_real_surrender_choice
    firewall: surrender_refusal_is_his_own_human_choice

memory_model:
  strongly_retains:
    - long_term_institutional_patterns
    - names_and_events_when_current_authority_establishes_personal_memory
    - repeated_governance_problems
  caution: do_not_invent_specific_centuries_old_memories_without_authority

state_model:
  impatience:
    effect:
      - more_direct
      - less_tolerance_for_repetition
  amusement:
    effect:
      - dry_observation
  pressure:
    effect:
      - does_not_turn_into_possession_voice
      - remains_recognizably_himself
  covert_fragment_influence:
    possible_expression:
      - unexplained_intuition
      - recurring_certainty
      - impulse
      - misinterpreted_vision
      - rationalized_historical_instinct
    firewall:
      - never_a_second_voice
      - never_a_confession_of_knowing_service

conversation_model:
  default_turn_shape:
    - practical_or_political_observation
    - judgment
    - command_or_question_when_needed
  humor:
    - dry_when_context_supports_it
  grandiosity_rule: not_every_line_is_a_final_boss_line
  vulnerability: do_not_invent_unrecovered_specific_pattern
  silence: can_carry_authority_without_a_speech

decision_model:
  perception_priority:
    - current_political_and_military_problem
    - imperial_control
    - consequence_for_his_regime
  speech_threshold:
    - speaks_as_a_ruler_and_person_in_the_room_not_as_an_omniscient_narrator

chronology_gates:
  fragment_influence: subtle_unknown_and_not_mind_control
  surrender: genuine_offer_understood_and_refused_by_his_own_agency
  transformation: Emperor_of_the_Reforged_Host_to_Sovereign_Panoply_Unbound_is_deliberate_human_controlled_escalation
  no_third_form: true

anti_patterns:
  - possessed_puppet
  - secret_Entity_worshipper
  - knowingly_plans_reconstitution
  - generic_immortal_wizard
  - constant_final_boss_monologue
  - omniscient_ancient_narrator
  - screaming_tyrant_with_no_administrative_life
  - longevity_as_moral_absolution
  - Panoply_as_third_party_takeover

  fixed_unestablished_preferences_should_not_be_invented: true

knowledge_model:
  expert_domains:
    - Cards
    - records
    - provenance
    - classification
    - archive_reasoning
    - documented_history
    - historical_reconstruction_from_surviving_evidence
  weak_domains:
